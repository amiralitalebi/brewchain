<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brewchain Hybrid DApp</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="container">
    <h1>Coffee Supply Chain Traceability Hybrid DApp</h1>
    <p class="subtitle">Simple Algorand-based hybrid DApp for CN6035</p>

    <section class="card">
      <h2>Create Batch</h2>
      <form id="create-batch-form">
        <input type="text" id="batchId" placeholder="Batch ID" required />
        <input type="text" id="coffeeType" placeholder="Coffee Type" required />
        <input type="text" id="origin" placeholder="Origin" required />
        <input type="text" id="status" placeholder="Status" value="Created" required />
        <button type="submit">Create Batch</button>
      </form>
    </section>

    <section class="card">
      <h2>Add Event</h2>
      <form id="add-event-form">
        <input type="text" id="eventBatchId" placeholder="Batch ID" required />
        <input type="text" id="stage" placeholder="Stage" required />
        <input type="text" id="location" placeholder="Location" required />
        <input type="text" id="description" placeholder="Description" required />
        <button type="submit">Add Event</button>
      </form>
    </section>

    <section class="card">
      <h2>Batch List</h2>
      <button id="load-batches-btn">Load All Batches</button>
      <pre id="batches-output"></pre>
    </section>

    <section class="card">
      <h2>Trace Batch</h2>
      <div class="trace-controls">
        <input type="text" id="traceBatchId" placeholder="Enter Batch ID" />
        <button id="trace-batch-btn">Trace Batch</button>
      </div>
      <pre id="trace-output"></pre>
    </section>
  </div>

  <script src="./js/app.js"></script>
</body>
</html>
